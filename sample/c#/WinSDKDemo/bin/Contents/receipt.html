<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 내역 영수증</title>
    <style>
        body {
            font-family: "맑은 고딕", sans-serif;
            background-color: white;
            color: black;
            margin: 0;
            padding: 1px;
        }
        .receipt-container {
            border: 0px solid black;
            padding: 0px;
            width: 100%;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 2px solid black;
            padding: 10px;
            font-size: 22pt;
        }
        th {
            background-color: #f2f2f2;
        }
        td:nth-child(1) {
            text-align: left;
        }
        .price {
            text-align: right;
        }
        .quantity {
            text-align: center;
        }                  
        .thank-you {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="receipt-container">
    <h1>맛피아 집</h1>
    <p style="text-align: left; font-size: 20px;">주문 내역</p>

    <table>
        <tr>
            <th>메뉴</th>
            <th>수량</th>
            <th>가격</th>
        </tr>
        <tr>
            <td>마르게리타 피자</td>
            <td class="quantity">1</td>
            <td class="price">15,000원</td>
        </tr>
        <tr>
            <td>까르보나라 파스타</td>
            <td class="quantity">2</td>
            <td  class="price">18,000원</td>
        </tr>
        <tr>
            <td>티라미수</td>
            <td class="quantity">1</td>
            <td class="price">8,000원</td>
        </tr>
    </table>

    <br/>

    <div class="thank-you">
        감사합니다! 맛있게 드세요.
    </div>
</div>

</body>
</html>
